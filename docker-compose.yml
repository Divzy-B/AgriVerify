services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agriverify:agriverify@db:5432/agriverify
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agriverify
      POSTGRES_USER: agriverify
      POSTGRES_PASSWORD: agriverify
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriverify -d agriverify"]
      interval: 5s
      timeout: 5s
      retries: 10

